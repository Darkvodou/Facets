name: Facets
version: '${version}'
main: fr.darkvodou.facets.Facets
api-version: '1.21'
description: Adds extra masks, a loft selection, a speed command, a fuzzy fill, a symmetry tool, a gravity toggle, a cover fix, a magnet deform, a color replace and a type replace to FastAsyncWorldEdit.
author: darkvodou
depend: [FastAsyncWorldEdit]

commands:
  /loft:
    description: Loft selection (curved surface through splines).
    usage: "//loft [smooth | poly | facet | set <pattern> [count] [-o -c -d -h -n -u] | viz]"
    permission: facets.loft
  /rpos1:
    description: Removes the last loft frame (pos1), or the closest one with -r / -c.
    usage: "//rpos1 [amount] [-r | -c]"
    permission: facets.loft
  /rpos2:
    description: Removes the last loft point (pos2), or the closest one with -r / -c.
    usage: "//rpos2 [amount] [-r | -c]"
    permission: facets.loft
  /fuzzyfill:
    description: Fills the layer of air at your feet without going through the holes up to the tolerance.
    usage: "//fuzzyfill <pattern> <radius> [tolerance] [direction]"
    permission: facets.fuzzyfill
  /fuzzyfillr:
    description: Like //fuzzyfill, in the layer of your feet and everything past it in the direction.
    usage: "//fuzzyfillr <pattern> <radius> [tolerance] [direction]"
    permission: facets.fuzzyfill
  /fuzzyfills:
    description: Like //fuzzyfill, in the whole sphere around you.
    usage: "//fuzzyfills <pattern> <radius> [tolerance]"
    permission: facets.fuzzyfill
  /sym:
    description: Copies the blocks placed by hand or with FAWE around a symmetry point.
    usage: "//sym [set [type] [even | odd] | placeaim [type] [even | odd] | type <type> | range <blocks | max> | swap | share [player] | toggle | off | info]"
    aliases: [/symmetry]
    permission: facets.symmetry
  /sym2:
    description: Adds a second symmetry point, which copies the first symmetry and its copies.
    usage: "//sym2 [set [type] [even | odd] | placeaim [type] [even | odd] | type <type> | swap | toggle | off | info]"
    aliases: [/symmetry2]
    permission: facets.symmetry
  /gravity:
    description: Makes the sand, gravel, concrete powder and anvils set with FAWE fall (toggle).
    usage: "//gravity"
    permission: facets.gravity
  /fixcover:
    description: Makes the glow lichen, sculk veins, resin clumps and vines cover the blocks next to them (follows the gmask).
    usage: "//fixcover [radius]"
    permission: facets.fixcover
  /fdeform:
    description: Deforms the selection. magnet pulls it toward you, the closest blocks the most (force 1 to 100, 100 brings the first solid block 90% of the way, -m only pulls the blocks matching the mask, like //move -m, -t lets the blocks go out of the selection).
    usage: "//fdeform magnet [force] [-m <mask>] [-t]"
    permission: facets.fdeform
  /fbrush:
    description: "Binds a FAWE magnet brush: left click chooses the zone, right click pulls it toward the point clicked (/size, /range, /mask, /tracemask work on it)."
    usage: "//fbrush magnet [radius] [force] [-m <mask>] [-t]"
    aliases: [/fbr]
    permission: facets.fdeform
  /replacecolor:
    description: Changes the color of the blocks in the selection, keeping their state.
    usage: "//replacecolor [color] [new color]"
    aliases: [/cr]
    permission: facets.replacecolor
  /typereplace:
    description: Changes the type of the blocks in the selection (oak to spruce), keeping their state.
    usage: "//typereplace [type] [new type]"
    aliases: [/tr]
    permission: facets.typereplace
  speed:
    description: Sets your flight speed when flying, else your walking speed (1 is the usual speed, 10 the fastest).
    usage: "/speed [speed]"
    permission: facets.speed
  variant:
    description: Opens the variants of the block in hand (every stairs for oak_stairs).
    usage: "/variant"
    aliases: [variants]
    permission: facets.variants
  family:
    description: Opens the family of the block in hand (every oak block for oak_stairs).
    usage: "/family"
    permission: facets.variants
  facets:
    description: Reloads the Facets configuration.
    usage: "/facets reload"
    aliases: [mtools]
    permission: facets.reload

permissions:
  facets.loft:
    description: Use the loft selection and its commands.
    default: op
  facets.fuzzyfill:
    description: Use //fuzzyfill, //fuzzyfillr and //fuzzyfills.
    default: op
  facets.symmetry:
    description: Use //sym, //sym2 and their symmetries.
    default: op
  facets.gravity:
    description: Use //gravity.
    default: op
  facets.fixcover:
    description: Use //fixcover.
    default: op
  facets.fdeform:
    description: Use //fdeform and //fbrush.
    default: op
  facets.replacecolor:
    description: Use //replacecolor.
    default: op
  facets.typereplace:
    description: Use //typereplace.
    default: op
  facets.speed:
    description: Use /speed.
    default: op
  facets.menu:
    description: Open the Facets menu with the menu item (a nether star by default).
    default: op
  facets.variants:
    description: Use /variant and /family (gives the chosen blocks).
    default: op
  facets.reload:
    description: Reload the Facets configuration.
    default: op
