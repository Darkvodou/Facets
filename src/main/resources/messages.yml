# MoreTools messages. Reload with /moretools reload.
# Colors use FAWE's legacy codes (&7 gray, &c red...), and &#rrggbb for hex colors.
# Placeholders are written {name}. An empty message is not sent.
# If you edited an older messages.yml, delete it so it is created again with the {info} / {error} colors.

# Added before every message. FAWE's own prefix is "&8(&4&lFAWE&8)&7 "
prefix: "&8(&4&lMORE&8)&7 "

# Colors used by the messages below through {info}, {error} and {warning}.
# Info is gray like FAWE's messages. An empty color keeps the last color of the prefix.
colors:
  info: "&7"
  error: ""
  warning: ""

no-permission: "{error}You are lacking the permission node: {permission}"
player-only: "{error}This command can only be used by a player."
usage: "{error}Usage: {usage}"

reload:
  done: "{info}Configuration reloaded!"
  warning: "{warning}{message}"

loft:
  # Description of the loft selection in //sel list (no prefix, like the other lines)
  description: "Select a lofted surface through splines"
  description-poly: "Select a low poly lofted surface (straight segments)"
  description-facet: "Select a lofted surface made of flat triangles"
  selected: "{info}Loft selector: left click=new frame, right click=add a point to the frame."
  selected-poly: "{info}Loft poly selector: left click=new frame, right click=add a point to the frame."
  selected-facet: "{info}Loft facet selector: left click=new frame, right click=add a point to the frame."
  already-selected: "{error}You are already using the loft selection."
  already-selected-poly: "{error}You are already using the loft poly selection."
  already-selected-facet: "{error}You are already using the loft facet selection."
  primary: "{info}Started loft frame #{frame} at {position} ({volume})."
  secondary: "{info}Added point #{point} to loft frame #{frame} at {position} ({volume})."
  # Lines shown by //size
  info-frames: "{info}{frames}"
  info-points: "{info}{points}"
  cannot-expand: "{error}A loft selection cannot be expanded."
  cannot-contract: "{error}A loft selection cannot be contracted."

  no-selection: "{error}Make a loft selection first (//sel loft)."
  incomplete: "{error}The loft needs at least two points."
  invalid-count: "{error}Invalid count: {count}"
  count-too-low: "{error}The count must be at least 1."
  invalid-flag: "{error}The flag {flag} is not applicable here"
  invalid-pattern: "{error}{message}"
  done: "{info}Operation completed ({count})."
  failed: "{error}An error occurred: {message}"
  particles-on: "{info}Loft particles enabled."
  particles-off: "{info}Loft particles disabled."

  removed-frame: "{info}Removed loft frame at {position} ({frames} frames, {points} points left)."
  removed-point: "{info}Removed loft point at {position} ({frames} frames, {points} points left)."
  removed-frames: "{info}Removed {count} loft frames ({frames} frames, {points} points left)."
  removed-points: "{info}Removed {count} loft points ({frames} frames, {points} points left)."
  no-frame: "{error}No loft frame to remove."
  no-point: "{error}No loft point to remove."

fuzzyfill:
  invalid-number: "{error}Invalid number: {value}"
  radius-range: "{error}The radius must be between 1 and {max}."
  tolerance-range: "{error}The tolerance must be between 0 and the radius ({max})."
  invalid-pattern: "{error}{message}"
  not-air: "{error}Stand in the air you want to fill."
  no-room: "{error}No space around you is wider than the tolerance ({tolerance})."
  done: "{info}Operation completed ({count})."
  failed: "{error}An error occurred: {message}"

symmetry:
  set: "{info}Symmetry {type} set at {position} ({copies} blocks per block, range {range})."
  type: "{info}Symmetry type set to {type} ({copies} blocks per block)."
  range: "{info}Symmetry range set to {range} blocks."
  range-limit: "{error}The range must be between 1 and {max}."
  invalid-number: "{error}Invalid number: {value}"
  unknown-type: "{error}Unknown symmetry type: {type}. Types: {types}"
  paused: "{info}Symmetry paused (//sym toggle to resume)."
  resumed: "{info}Symmetry resumed."
  removed: "{info}Symmetry removed."
  out-of-range: "{warning}{count} blocks were more than {range} blocks from the symmetry point and were not copied (//sym range)."
  confirm: "{warning}This edit goes beyond your symmetry range ({range}). Copy it up to {max} blocks? Your range will become {max}. ({seconds}s)"
  confirm-button: "&a[Confirm]"
  cancel-button: "&c[Cancel]"
  confirmed: "{info}Copying up to {max} blocks from the symmetry point. Your range is now {max}."
  not-confirmed: "{warning}Not confirmed: copies are kept within your range ({range})."
  none: "{error}You have no symmetry (//sym set [type])."
  info: "{info}Symmetry {type} at {position} in {world} ({copies} blocks per block, range {range})."
  info-paused: "{info}Symmetry {type} at {position} in {world} ({copies} blocks per block, range {range}), paused."

# The MoreTools menu. Lore lines are separated by \n
menu:
  title: "MoreTools"
  tab:
    selections: "&6Selections"
    masks: "&6Masks"
    symmetry: "&6Symmetry"

  selections:
    name: "&e{name}"
    cuboid: "&7Select two corners of a cuboid"
    extend: "&7Fast cuboid selection mode"
    poly: "&7Select a 2D polygon with height"
    ellipsoid: "&7Select an ellipsoid"
    sphere: "&7Select a sphere"
    cyl: "&7Select a cylinder"
    convex: "&7Select a convex polyhedral"
    polyhedral: "&7Select a hollow polyhedral"
    fuzzy: "&7Select all connected blocks"
    loft: "&7Select a lofted surface through splines"
    loftpoly: "&7Select a low poly lofted surface"
    loftfacet: "&7Select a lofted surface of flat triangles"
    clear: "&cClear the selection"
    clear-lore: "&7Runs //sel"

  masks:
    current: "&eCurrent global mask"
    current-lore: "&f{mask}"
    current-none: "&7No global mask"
    current-unknown: "&7A mask is set, but it was set before\n&7the server started: set it again to see it"
    save: "&aSave as favorite"
    save-lore: "&f{mask}"
    saved: "{info}Saved {mask} as favorite."
    not-saved: "{error}This mask is already a favorite, or you have {max} favorites."
    clear: "&cRemove the global mask"
    clear-lore: "&7Runs //gmask"
    favorite: "&f{mask}"
    favorite-lore: "&7Left click: set as global mask\n&7Right click: remove from favorites"
    no-favorite: "&7No favorite yet"
    no-favorite-lore: "&7Set a mask with //gmask <mask>,\n&7then save it here"

  symmetry:
    status: "&eSymmetry"
    status-none: "&7No symmetry point"
    status-on: "&aActive\n&7Type: &f{type} &7({copies} blocks per block)\n&7Point: &f{position} &7in &f{world}\n&7Range: &f{range}"
    status-off: "&7Paused\n&7Type: &f{type} &7({copies} blocks per block)\n&7Point: &f{position} &7in &f{world}\n&7Range: &f{range}"
    set: "&eSet the point here"
    set-lore: "&7Puts the symmetry point at your feet"
    pause: "&aActive &7- click to pause"
    resume: "&7Paused - click to resume"
    toggle-lore: "&7Keeps the point and the type"
    remove: "&cRemove the symmetry"
    remove-lore: "&7Runs //sym off"
    type: "&e{type}"
    type-simple2d: "&7Half turn around the vertical axis\n&7{copies} blocks per block"
    type-planx: "&7Mirror across the X plane\n&7{copies} blocks per block"
    type-plany: "&7Mirror across the Y plane (up / down)\n&7{copies} blocks per block"
    type-planz: "&7Mirror across the Z plane\n&7{copies} blocks per block"
    type-cross2d: "&7planx + planz\n&7{copies} blocks per block"
    type-cross3d: "&7planx + plany + planz\n&7{copies} blocks per block"
    type-star2d: "&7cross2d + 45° diagonals\n&7{copies} blocks per block"
    type-star3d: "&7star2d + up / down mirror\n&7{copies} blocks per block"
    type-megastar: "&7star3d around the three axes\n&7{copies} blocks per block"
    range: "&eRange: {range}"
    range-lore: "&7Click: maximum ({max})"
    range-step: "&e{step}"
    range-step-lore: "&7Range {range}"
